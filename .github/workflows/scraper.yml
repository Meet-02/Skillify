name: Background Scrapers
on:
  schedule:
    - cron: '0 */12 * * *' # Runs every 12 hours
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Chrome & Xvfb (Fake Screen)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb
          
      - name: Install Dependencies
        run: pip install --ignore-installed PyYAML -r requirements.txt selenium undetected-chromedriver webdriver-manager fake-useragent pymysql beautifulsoup4 pandas
        
      - name: Run Scrapers inside Fake Screen
        env:
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASS: ${{ secrets.TIDB_PASS }}
          TIDB_NAME: ${{ secrets.TIDB_NAME }}
          TIDB_PORT: 4000
          ZENROWS_KEYS: ${{ secrets.ZENROWS_KEYS }}
        # Notice the 'xvfb-run' command here!
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python run_background_scraper.py